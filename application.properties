spring.application.name=Login-RegisterApp


spring.jpa.show-sql=true
# CRITICAL: Ensure 'createDatabaseIfNotExist=true' for first run
spring.datasource.url=jdbc:mysql://localhost/inkspire?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


file.upload-dir=F:/Frontend/Login-RegisterApp/src/main/resources/static/assets/icons/
