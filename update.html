<!-- ------------------------------------------------------------ -->

<div class="wrapper" *ngIf="userRepo">
  <h1>Update Form</h1>
  <div class="form-container">
    <form #updateData="ngForm" (ngSubmit)="update(updateData)">

      <!-- User Name -->
      <label for="userName">User Name</label>
      <input type="text" id="userName" name="userName" required minlength="3" [(ngModel)]="userRepo.userName" #userName="ngModel">
      <div class="error" *ngIf="userName.invalid && (userName.dirty || userName.touched)">
        <small *ngIf="userName.errors?.['required']">User Name is required.</small>
        <small *ngIf="userName.errors?.['minlength']">Minimum 3 characters required.</small>
      </div>

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required email [(ngModel)]="userRepo.email" #email="ngModel">
      <div class="error" *ngIf="email.invalid && (email.dirty || email.touched)">
        <small *ngIf="email.errors?.['required']">Email is required.</small>
        <small *ngIf="email.errors?.['email']">Enter a valid email address.</small>
      </div>

      <!-- Password -->
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6" [(ngModel)]="userRepo.password" #password="ngModel">
      <div class="error" *ngIf="password.invalid && (password.dirty || password.touched)">
        <small *ngIf="password.errors?.['required']">Password is required.</small>
        <small *ngIf="password.errors?.['minlength']">Minimum 6 characters required.</small>
      </div>

      <!-- Address -->
      <label for="address">Address</label>
      <textarea id="address" name="address" required rows="4" [(ngModel)]="userRepo.address" placeholder="Enter your address" #address="ngModel"></textarea>
      <div class="error" *ngIf="address.invalid && (address.dirty || address.touched)">
        <small *ngIf="address.errors?.['required']">Address is required.</small>
      </div>

      <!-- Mobile -->
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" [(ngModel)]="userRepo.mobile" placeholder="Enter your Mobile number" #mobile="ngModel">
      <div class="error" *ngIf="mobile.invalid && (mobile.dirty || mobile.touched)">
        <small *ngIf="mobile.errors?.['required']">Mobile number is required.</small>
        <small *ngIf="mobile.errors?.['pattern']">Enter a valid 10-digit mobile number.</small>
      </div>

      <!-- Submit button disabled if form is invalid -->
      <button type="submit" id="submit" [disabled]="updateData.invalid">Update</button>

    </form>
  </div>
</div>
